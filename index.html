<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quad Find — AI-Powered Smart Campus Lost & Found</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="min-h-full bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col font-sans transition-colors duration-200">
  
  <!-- Global Top Header Navigation -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 cursor-pointer select-none" onclick="window.switchTab('dashboard')">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-teal-400 flex items-center justify-center text-white text-xl font-black shadow-md shadow-indigo-600/30">
          <i class="fas fa-satellite-dish text-sm"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="text-base font-black tracking-tight text-slate-900 dark:text-white">QUAD<span class="text-indigo-600 dark:text-indigo-400">FIND</span></span>
            <span class="px-1.5 py-0.2 rounded bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-[9px] font-black uppercase tracking-wider">AI 2.0</span>
          </div>
          <span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium block -mt-0.5">Smart Campus Lost & Found</span>
        </div>
      </div>

      <!-- Desktop Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1 p-1 bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700/60">
        <button id="nav-dashboard" onclick="window.switchTab('dashboard')" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-bold text-xs transition-all flex items-center gap-2">
          <i class="fas fa-chart-pie"></i>
          <span>Dashboard</span>
        </button>
        <button id="nav-explore" onclick="window.switchTab('explore')" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-bold text-xs transition-all flex items-center gap-2">
          <i class="fas fa-compass"></i>
          <span>Explore Items</span>
        </button>
        <button id="nav-ai-hub" onclick="window.switchTab('ai-hub')" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-bold text-xs transition-all flex items-center gap-2">
          <i class="fas fa-sparkles text-indigo-500"></i>
          <span>AI Matches Hub</span>
        </button>
        <button id="nav-campus-map" onclick="window.switchTab('campus-map')" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-bold text-xs transition-all flex items-center gap-2">
          <i class="fas fa-map-marked-alt"></i>
          <span>Campus Map</span>
        </button>
      </nav>

      <!-- Right Action Controls -->
      <div class="flex items-center gap-2">
        <!-- Seed Data Reset Button for Hackathons -->
        <button onclick="window.resetToSeedData()" title="Reset Seed Demo Data" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 text-xs font-semibold transition-all">
          <i class="fas fa-rotate-left"></i>
        </button>

        <!-- Dark/Light Mode Switcher -->
        <button id="theme-toggle-btn" onclick="window.toggleDarkMode()" title="Toggle Dark/Light Mode" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs transition-all">
          <i class="fas fa-moon"></i>
        </button>

        <!-- Primary Action: Report Item -->
        <button onclick="window.openReportModal()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-teal-500 hover:from-indigo-500 hover:to-teal-400 text-white font-extrabold text-xs shadow-md shadow-indigo-600/30 transition-all flex items-center gap-2">
          <i class="fas fa-plus"></i>
          <span class="hidden sm:inline">Report Item</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 mb-16 md:mb-6">
    <div id="app-main-content">
      <!-- Injected via JavaScript Views -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 py-6 text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
      <div class="flex items-center gap-2">
        <span class="font-black text-slate-700 dark:text-slate-300">Quad Find</span> &bull; 
        <span>AI-Powered Smart Campus Lost & Found Platform</span>
      </div>
      <div class="flex items-center gap-4 text-[11px]">
        <span><i class="fas fa-shield-alt text-emerald-500 mr-1"></i> Campus Police Verified Safe Hubs</span>
        <span>&bull;</span>
        <button onclick="window.resetToSeedData()" class="hover:underline text-indigo-500">Reset Demo State</button>
      </div>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation Bar (Visible on small screens) -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-4 py-2.5 flex items-center justify-around shadow-lg">
    <button id="mobile-nav-dashboard" onclick="window.switchTab('dashboard')" class="flex flex-col items-center justify-center text-indigo-600 font-extrabold text-[10px]">
      <i class="fas fa-chart-pie text-base mb-0.5"></i>
      <span>Home</span>
    </button>
    <button id="mobile-nav-explore" onclick="window.switchTab('explore')" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 font-semibold text-[10px]">
      <i class="fas fa-compass text-base mb-0.5"></i>
      <span>Browse</span>
    </button>
    <button onclick="window.openReportModal()" class="w-10 h-10 rounded-full bg-gradient-to-r from-indigo-600 to-teal-500 text-white flex items-center justify-center text-lg font-bold shadow-lg shadow-indigo-600/40 -mt-5">
      <i class="fas fa-plus"></i>
    </button>
    <button id="mobile-nav-ai-hub" onclick="window.switchTab('ai-hub')" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 font-semibold text-[10px]">
      <i class="fas fa-sparkles text-base mb-0.5"></i>
      <span>AI Hub</span>
    </button>
    <button id="mobile-nav-campus-map" onclick="window.switchTab('campus-map')" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 font-semibold text-[10px]">
      <i class="fas fa-map-marked-alt text-base mb-0.5"></i>
      <span>Map</span>
    </button>
  </div>

  <!-- Dynamic Modal Container -->
  <div id="modal-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 sm:right-6 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-auto"></div>

  <!-- Main JavaScript Application Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
